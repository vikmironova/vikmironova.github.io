<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@300;400;500;700&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
  <div class="container">
    <header class="site-header">
      <a href="{{ '/' | relative_url }}" class="site-title">
        <span class="first">Viktoriya</span> <span class="last">Mironova</span>
      </a>
      <nav class="site-nav">
        {% for item in site.navigation %}
          {% assign current = false %}
          {% if page.url == item.url %}{% assign current = true %}{% endif %}
          <a href="{{ item.url | relative_url }}"{% if current %} class="active"{% endif %}>{{ item.title }}</a>
        {% endfor %}
      </nav>
    </header>

    <main class="page-content">
      {{ content }}
    </main>

    <footer class="site-footer">
      &copy; {{ site.time | date: '%Y' }} {{ site.author.name }} · Almaty, Kazakhstan
    </footer>
  </div>
</body>
</html>
